name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Also scans dist/ for external URLs and checks the pre-paint theme script (vitest.build.config.ts).
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
